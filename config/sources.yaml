version: 1
sources:
- name: bluesky-jetstream
  adapter: jetstream
  enabled: true
  target: wss://jetstream2.us-east.bsky.network/subscribe
  language: und
  poll_interval_seconds: 300
  trust: 0.45
  tags:
  - social
  - global
  store_text: true
  options:
    collections:
    - app.bsky.feed.post
    max_messages: 100
    read_timeout_seconds: 10
- name: mastodon-weather
  adapter: mastodon
  enabled: true
  target: https://mastodon.social
  language: en
  poll_interval_seconds: 600
  trust: 0.45
  tags:
  - social
  - global
  store_text: true
  env_token: MASTODON_ACCESS_TOKEN
  options:
    hashtags:
    - weather
    - rain
    - snow
    - storm
    - meteo
    - погода
    - дождь
    - снег
    limit: 40
- name: x-weather
  adapter: x_recent
  enabled: false
  target: https://api.x.com/2/tweets/search/recent
  language: und
  poll_interval_seconds: 900
  trust: 0.45
  tags:
  - social
  - global
  - paid-api
  store_text: true
  env_token: X_BEARER_TOKEN
  options:
    query: '(weather OR rain OR snow OR storm OR meteo OR погода OR дождь OR снег OR lluvia OR nieve OR tormenta OR météo OR pluie OR neige OR tempête OR Wetter OR Regen OR Schnee OR Sturm) -is:retweet'
    max_results: 10
- name: google-news-global-en
  adapter: google_news
  enabled: true
  target: https://news.google.com/rss/search
  language: en
  poll_interval_seconds: 3600
  trust: 0.62
  tags: [news, search, global]
  store_text: true
  options:
    hl: en-US
    gl: US
    ceid: US:en
    total_limit: 18
    per_query_limit: 8
    delay_seconds: 0.25
    queries:
    - '(flash flood OR flooding OR inundation) when:1d'
    - '(hailstorm OR hail OR tornado OR waterspout) when:1d'
    - '("heavy snow" OR blizzard OR "ice storm" OR avalanche) when:1d'
    - '(heatwave OR "record heat" OR "extreme heat" OR drought) when:1d'
    - '(typhoon OR hurricane OR "tropical cyclone") when:1d'
    - '("severe thunderstorm" OR "dust storm" OR "freezing rain") when:1d'
