name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=ai_weather_signals --cov-report=term-missing
      - name: Reject common secret artifacts
        shell: bash
        run: |
          test ! -e .env
          ! git ls-files | grep -E '(^|/)(.*\.session|.*\.dump|.*\.backup|models/|data/private/)'
